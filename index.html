<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<title>Projeção Check</title>
<link rel="manifest" href="manifest.json">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #0b0e14; color: #eef1f6;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overscroll-behavior: none;
  }
  /* Camera fills the whole viewport, edge to edge, behind everything else */
  #stage {
    position: fixed; inset: 0; overflow: hidden;
    background: #000; display: flex; align-items: center; justify-content: center;
    z-index: 0; touch-action: none;
  }
  video {
    width: 100%; height: 100%; object-fit: cover;
    display: block; transform-origin: center center;
  }

  /* Captured photo review: sized to its own aspect ratio (not cropped), centered by #stage's flex */
  #captureWrap { display: none; position: relative; touch-action: none; }
  #captureWrap.show { display: block; }
  #captureCanvas {
    display: block; width: auto; height: auto;
    max-width: 92vw; max-height: 76vh;
  }

  #grid-overlay {
    position: absolute; inset: 0; pointer-events: none;
    display: none;
  }
  #grid-overlay.show { display: block; }

  #result-overlay {
    position: absolute; inset: 0; pointer-events: none; display: none;
  }
  #result-overlay.show { display: block; }
  .zone-label {
    position: absolute; transform: translate(-50%, -50%);
    font-size: 13px; font-weight: 700; padding: 3px 8px; border-radius: 6px;
    background: rgba(10,12,16,0.75); border: 1px solid rgba(255,255,255,0.15);
    white-space: nowrap;
  }

  #status {
    position: absolute; top: 10px; left: 10px; right: 10px;
    text-align: center; font-size: 12px; color: #c7cedb;
    background: rgba(10,12,16,0.55); padding: 6px 10px; border-radius: 8px;
    pointer-events: none;
  }

  /* Manual mask: darkens everything outside the rectangle, two draggable corner handles */
  #mask-layer { position: absolute; inset: 0; display: none; touch-action: none; }
  #mask-layer.show { display: block; }
  #mask-svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .mask-handle {
    position: absolute; width: 30px; height: 30px; margin: -15px;
    border-radius: 50%; background: rgba(74,222,128,0.25);
    border: 2px solid #4ade80; touch-action: none;
  }
  .mask-handle::after {
    content: ''; position: absolute; inset: 9px; border-radius: 50%; background: #4ade80;
  }

  .pill {
    position: absolute; font-size: 11px; font-weight: 600; color: #d7dbe4;
    background: rgba(10,12,16,0.6); border: 1px solid rgba(255,255,255,0.25);
    border-radius: 999px; padding: 4px 10px; pointer-events: none;
  }
  #zoomBadge { top: 10px; right: 10px; display: none; }

  /* UI layer floats above the fixed camera layer; only its own controls are interactive */
  #app {
    position: fixed; inset: 0; z-index: 1;
    display: flex; flex-direction: column;
    pointer-events: none;
  }
  #app > * { pointer-events: auto; }
  #spacer { flex: 1; pointer-events: none; }

  header {
    padding: 10px 16px;
    display: flex; align-items: center; justify-content: space-between;
    background: linear-gradient(rgba(6,8,12,0.65), rgba(6,8,12,0.15));
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .2px; }
  header .badge {
    font-size: 11px; color: #d7dbe4; border: 1px solid rgba(255,255,255,0.25);
    border-radius: 999px; padding: 2px 8px; background: rgba(10,12,16,0.4);
  }

  footer {
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: linear-gradient(rgba(6,8,12,0.15), rgba(6,8,12,0.7));
    display: flex; gap: 8px; align-items: center; justify-content: center;
    flex-wrap: wrap;
  }
  button {
    appearance: none; border: none; border-radius: 12px;
    font-size: 15px; font-weight: 600; padding: 13px 20px;
    cursor: pointer; color: #0b0e14; background: #eef1f6;
  }
  button.secondary {
    background: rgba(10,12,16,0.5); color: #eef1f6; border: 1px solid rgba(255,255,255,0.3);
  }
  button.toggle-on {
    background: rgba(74,222,128,0.2); color: #4ade80; border: 1px solid #4ade80;
  }
  button:active { opacity: .8; }

  #report {
    display: none;
    padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
    background: rgba(8,10,15,0.92);
    max-height: 40vh; overflow-y: auto;
    font-size: 13px;
  }
  #report.show { display: block; }

  /* Short viewports (landscape phones): keep the floating bars thin so framing area stays large */
  @media (orientation: landscape) and (max-height: 500px) {
    header { padding: 6px 12px; }
    header h1 { font-size: 13px; }
    footer { padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); }
    button { padding: 9px 16px; font-size: 13px; }
    #report { max-height: 55vh; }
  }
  #report h2 { font-size: 14px; margin: 0 0 8px; }
  .zone-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 7px 0; border-bottom: 1px solid #171b24;
  }
  .zone-row:last-child { border-bottom: none; }
  .zone-name { color: #c7cedb; }
  .zone-score { font-variant-numeric: tabular-nums; font-weight: 700; }
  .ok { color: #4ade80; }
  .warn { color: #facc15; }
  .bad { color: #f87171; }
</style>
</head>
<body>
<div id="stage">
  <video id="video" autoplay playsinline muted></video>

  <svg id="grid-overlay" class="show" viewBox="0 0 100 100" preserveAspectRatio="none">
    <line x1="33.3" y1="0" x2="33.3" y2="100" stroke="rgba(255,255,255,0.25)" stroke-width="0.3"/>
    <line x1="66.6" y1="0" x2="66.6" y2="100" stroke="rgba(255,255,255,0.25)" stroke-width="0.3"/>
    <line x1="0" y1="33.3" x2="100" y2="33.3" stroke="rgba(255,255,255,0.25)" stroke-width="0.3"/>
    <line x1="0" y1="66.6" x2="100" y2="66.6" stroke="rgba(255,255,255,0.25)" stroke-width="0.3"/>
  </svg>

  <div id="mask-layer" class="show">
    <svg id="mask-svg" viewBox="0 0 100 100" preserveAspectRatio="none">
      <path id="maskCutout" fill="rgba(0,0,0,0.55)" fill-rule="evenodd"/>
      <rect id="maskRectOutline" fill="none" stroke="#4ade80" stroke-width="0.4" stroke-dasharray="1.5,1.5"/>
    </svg>
    <div class="mask-handle" id="handleTL"></div>
    <div class="mask-handle" id="handleBR"></div>
  </div>

  <span class="pill" id="zoomBadge">1.0x</span>
  <div id="status">Aponte para a tela e ajuste a máscara verde nas bordas da projeção.</div>

  <div id="captureWrap">
    <canvas id="captureCanvas"></canvas>
    <div id="result-overlay"></div>
  </div>
</div>

<div id="app">
  <header>
    <h1>Projeção Check — Foco</h1>
    <span class="badge" id="modeBadge">câmera</span>
  </header>

  <div id="spacer"></div>

  <footer>
    <button class="secondary" id="btnRetry" style="display:none;">Nova captura</button>
    <button class="secondary toggle-on" id="btnMask">Máscara: ON</button>
    <button id="btnCapture">Capturar e analisar</button>
  </footer>

  <div id="report"></div>
</div>

<script src="app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
