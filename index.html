<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<title>Projeção Check</title>
<link rel="manifest" href="manifest.json">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #0b0e14; color: #eef1f6;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overscroll-behavior: none;
  }
  #app { display: flex; flex-direction: column; height: 100%; }

  header {
    padding: 12px 16px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid #1c212b;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: .2px; }
  header .badge {
    font-size: 11px; color: #8a93a3; border: 1px solid #2a3140;
    border-radius: 999px; padding: 2px 8px;
  }

  #stage {
    position: relative; flex: 1; overflow: hidden;
    background: #000; display: flex; align-items: center; justify-content: center;
  }
  video, canvas#captureCanvas {
    width: 100%; height: 100%; object-fit: cover;
    display: block;
  }
  #captureCanvas { display: none; }

  #grid-overlay {
    position: absolute; inset: 0; pointer-events: none;
    display: none;
  }
  #grid-overlay.show { display: block; }

  #result-overlay {
    position: absolute; inset: 0; pointer-events: none; display: none;
  }
  #result-overlay.show { display: block; }
  .zone-label {
    position: absolute; transform: translate(-50%, -50%);
    font-size: 13px; font-weight: 700; padding: 3px 8px; border-radius: 6px;
    background: rgba(10,12,16,0.75); border: 1px solid rgba(255,255,255,0.15);
    white-space: nowrap;
  }

  #status {
    position: absolute; top: 10px; left: 10px; right: 10px;
    text-align: center; font-size: 12px; color: #c7cedb;
    background: rgba(10,12,16,0.55); padding: 6px 10px; border-radius: 8px;
    pointer-events: none;
  }

  footer {
    padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
    border-top: 1px solid #1c212b;
    display: flex; gap: 10px; align-items: center; justify-content: center;
  }
  button {
    appearance: none; border: none; border-radius: 12px;
    font-size: 15px; font-weight: 600; padding: 14px 22px;
    cursor: pointer; color: #0b0e14; background: #eef1f6;
  }
  button.secondary {
    background: transparent; color: #eef1f6; border: 1px solid #2a3140;
  }
  button:active { opacity: .8; }

  #report {
    display: none;
    padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
    border-top: 1px solid #1c212b;
    max-height: 40vh; overflow-y: auto;
    font-size: 13px;
  }
  #report.show { display: block; }
  #report h2 { font-size: 14px; margin: 0 0 8px; }
  .zone-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 7px 0; border-bottom: 1px solid #171b24;
  }
  .zone-row:last-child { border-bottom: none; }
  .zone-name { color: #c7cedb; }
  .zone-score { font-variant-numeric: tabular-nums; font-weight: 700; }
  .ok { color: #4ade80; }
  .warn { color: #facc15; }
  .bad { color: #f87171; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Projeção Check — Foco</h1>
    <span class="badge" id="modeBadge">câmera</span>
  </header>

  <div id="stage">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="captureCanvas"></canvas>
    <svg id="grid-overlay" class="show" viewBox="0 0 100 100" preserveAspectRatio="none">
      <line x1="33.3" y1="0" x2="33.3" y2="100" stroke="rgba(255,255,255,0.25)" stroke-width="0.3"/>
      <line x1="66.6" y1="0" x2="66.6" y2="100" stroke="rgba(255,255,255,0.25)" stroke-width="0.3"/>
      <line x1="0" y1="33.3" x2="100" y2="33.3" stroke="rgba(255,255,255,0.25)" stroke-width="0.3"/>
      <line x1="0" y1="66.6" x2="100" y2="66.6" stroke="rgba(255,255,255,0.25)" stroke-width="0.3"/>
    </svg>
    <div id="result-overlay"></div>
    <div id="status">Aponte para a tela cheia com o padrão de foco e capture.</div>
  </div>

  <footer>
    <button class="secondary" id="btnRetry" style="display:none;">Nova captura</button>
    <button id="btnCapture">Capturar e analisar</button>
  </footer>

  <div id="report"></div>
</div>

<script src="app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
